name: Source checks
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow certifi bsdiff4==1.2.6 PySide6_Essentials==6.12.0
      - run: python -m compileall -q launcher scripts packaging/windows
      - run: python -m unittest discover -s tests -p test_bundled_release.py
      - run: python -m unittest discover -s tests -p test_launcher_updates.py
      - run: python -m unittest discover -s tests -p test_settings_navigation.py
